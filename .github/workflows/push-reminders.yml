name: Avisos push de vencimientos test

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-reminders-test
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == 'refs/heads/main' && vars.PIGGO_PUSH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Instalar dependencias
        run: python -m pip install psycopg==3.3.6 psycopg-binary==3.3.6 -r infra/jobs/requirements-push.txt
      - name: Enviar avisos elegibles
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
          PIGGO_VAPID_PRIVATE_KEY: ${{ secrets.PIGGO_VAPID_PRIVATE_KEY }}
          PIGGO_VAPID_CONTACT: ${{ vars.PIGGO_VAPID_CONTACT }}
        run: python infra/jobs/deliver_push.py

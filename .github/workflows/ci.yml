name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  web:
    name: Angular - pruebas y compilacion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test -- --watch=false
      - name: Compilar
        run: npm run build

  bff:
    name: BFF - pruebas y compilacion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/bff
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/bff/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias
        run: npm test
      - name: Ejecutar pruebas HTTP del BFF
        run: npm run test:e2e
      - name: Compilar
        run: npm run build

  api:
    name: API - dependencias y sintaxis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar compatibilidad de dependencias
        run: python -m pip check
      - name: Comprobar sintaxis de la aplicacion
        run: python -m compileall -q app

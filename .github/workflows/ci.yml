name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  web:
    name: Angular - pruebas y compilacion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test -- --watch=false
      - name: Compilar
        run: npm run build
      - name: Compilar para el entorno remoto de prueba
        run: npm run build:test
      - name: Comprobar los archivos estaticos y su commit
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          await access('dist/gastos-web/browser/index.html');
          const version = JSON.parse(await readFile('dist/gastos-web/browser/version.json', 'utf8'));
          assert.equal(version.commit, process.env.GITHUB_SHA);
          NODE

  bff:
    name: BFF - pruebas, compilacion e imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RENDER_GIT_COMMIT: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: gastos-runtime-ci
      FRONTEND_ORIGIN: https://gastos-ci.example.test
    defaults:
      run:
        shell: bash
        working-directory: apps/bff
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/bff/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias
        run: npm test
      - name: Ejecutar pruebas HTTP del BFF
        run: npm run test:e2e
      - name: Compilar
        run: npm run build
      - name: Validar Compose de las imagenes para despliegue
        run: docker compose --file ../../infra/ci/compose.runtime.yml config --quiet
      - name: Construir e iniciar API y BFF sin montajes
        run: docker compose --file ../../infra/ci/compose.runtime.yml up --detach --build
      - name: Comprobar el recorrido de las imagenes
        run: python3 ../../infra/ci/check-stack.py success --url http://127.0.0.1:18001/api/hello
      - name: Comprobar salud y commit del BFF
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18001/health |
            jq --exit-status '. == {"status":"ok"}'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18001/version |
            jq --exit-status --arg commit "$RENDER_GIT_COMMIT" '. == {"commit":$commit}'
      - name: Comprobar CORS en la imagen del BFF
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = 'http://127.0.0.1:18001/health';
          const allowed = await fetch(url, {
            headers: { Origin: process.env.FRONTEND_ORIGIN },
            signal: AbortSignal.timeout(10000),
          });
          assert.equal(allowed.status, 200);
          assert.equal(allowed.headers.get('access-control-allow-origin'), process.env.FRONTEND_ORIGIN);
          assert.equal(allowed.headers.get('access-control-allow-credentials'), null);
          const other = await fetch(url, {
            headers: { Origin: 'https://otro.example.test' },
            signal: AbortSignal.timeout(10000),
          });
          assert.equal(other.status, 200);
          assert.equal(other.headers.get('access-control-allow-origin'), null);
          NODE
      - name: Detener la API de la prueba de imagenes
        run: docker compose --file ../../infra/ci/compose.runtime.yml stop api
      - name: Comprobar error controlado y salud independiente
        run: |
          python3 ../../infra/ci/check-stack.py unavailable --url http://127.0.0.1:18001/api/hello
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18001/health |
            jq --exit-status '. == {"status":"ok"}'
      - name: Recuperar la API y comprobar el recorrido
        run: |
          docker compose --file ../../infra/ci/compose.runtime.yml start api
          python3 ../../infra/ci/check-stack.py success --url http://127.0.0.1:18001/api/hello
      - name: Mostrar los logs de las imagenes
        if: always()
        run: docker compose --file ../../infra/ci/compose.runtime.yml logs --no-color --tail=100
      - name: Retirar los contenedores de esta comprobacion
        if: always()
        run: docker compose --file ../../infra/ci/compose.runtime.yml down

  api:
    name: API - dependencias, sintaxis e imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: apps/api
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar compatibilidad de dependencias
        run: python -m pip check
      - name: Comprobar sintaxis de la aplicacion
        run: python -m compileall -q app
      - name: Probar el despliegue con respuestas simuladas
        run: python -m unittest discover -s ../../infra/cd -p 'test_*.py'
      - name: Probar la herramienta de roles locales
        run: python -m unittest discover -s ../../infra/postgres -p 'test_*.py'
      - name: Probar conexiones y filtros de migraciones
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Construir la imagen para despliegue
        run: docker build --tag gastos-api-runtime:ci --file Dockerfile .
      - name: Iniciar la imagen sin montajes del repositorio
        run: |
          docker run --detach --name gastos-api-runtime-ci \
            --env PORT=8000 \
            --env RENDER_GIT_COMMIT="$EXPECTED_COMMIT" \
            --publish 127.0.0.1:18000:8000 \
            gastos-api-runtime:ci
      - name: Comprobar el mensaje desde la imagen
        run: python ../../infra/ci/check-stack.py success --url http://127.0.0.1:18000/
      - name: Comprobar salud y commit de la imagen
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18000/health |
            jq --exit-status '. == {"status":"ok"}'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18000/version |
            jq --exit-status --arg commit "$EXPECTED_COMMIT" '. == {"commit":$commit}'
      - name: Mostrar los logs de la imagen de API
        if: always()
        run: docker logs --tail=100 gastos-api-runtime-ci
      - name: Retirar el contenedor de API de esta comprobacion
        if: always()
        run: docker rm --force gastos-api-runtime-ci

  integration:
    name: Integracion HTTP con Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python para la comprobacion HTTP
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir e iniciar los tres servicios
        run: docker compose up --detach --build
      - name: Comprobar el recorrido con FastAPI disponible
        run: python infra/ci/check-stack.py success
      - name: Detener FastAPI
        run: docker compose stop api
      - name: Comprobar el error controlado del BFF
        run: python infra/ci/check-stack.py unavailable
      - name: Volver a iniciar FastAPI
        run: docker compose start api
      - name: Comprobar la recuperacion del recorrido
        run: python infra/ci/check-stack.py success
      - name: Mostrar los logs del entorno
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Limpiar el entorno de esta ejecucion
        if: always()
        run: docker compose down

  database:
    name: PostgreSQL - reconstruccion y migraciones
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js para la CLI de Supabase
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Instalar dependencias de la API
        run: python -m pip install -r apps/api/requirements.txt
      - name: Probar los controles del entorno desechable
        run: python -m unittest discover -s infra/ci -p 'test_*.py'
      - name: Reconstruir y comprobar una base Supabase desechable
        run: python infra/ci/check_database.py

  deploy_test:
    name: Publicar test en Render
    needs: [web, bff, api, integration, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: test
      url: https://gastos-test-web.onrender.com
    concurrency:
      group: render-test
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Descargar el commit validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Comprobar si main avanzo durante CI
        id: current_main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: python infra/cd/check_main.py --commit "$DEPLOY_COMMIT"
      - name: Desplegar y verificar API, BFF y Angular
        if: steps.current_main.outputs.deploy == 'true'
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_BFF_SERVICE_ID: ${{ vars.RENDER_BFF_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
        run: python infra/cd/deploy_render.py --commit "$DEPLOY_COMMIT"

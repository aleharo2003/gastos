name: Actualizar cotizaciones USD test

on:
  schedule:
    # 19:42 en Buenos Aires.
    - cron: '42 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-usd-reference-test
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: test
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Instalar el cliente PostgreSQL
        run: python -m pip install psycopg==3.3.6 psycopg-binary==3.3.6
      - name: Consultar DolarApi y guardar las cotizaciones
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
        run: python infra/jobs/refresh_usd_reference.py
      - name: Registrar fallo
        if: failure()
        run: echo '::error::No se actualizó la cotización. Se conserva el dato anterior.'

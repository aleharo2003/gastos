name: Proceso diario de Piggo

on:
  schedule:
    # 01:29 en Buenos Aires para todas las tareas.
    - cron: '29 4 * * *'
    # 19:42 en Buenos Aires para refrescar las cotizaciones del cierre.
    - cron: '42 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Tarea a ejecutar en test
        type: choice
        options:
          - todo
          - cuotas
          - vencimientos
          - cotizaciones
        default: todo

permissions:
  contents: read

concurrency:
  group: daily-operations-test
  cancel-in-progress: false

jobs:
  run-daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: test
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Instalar el cliente PostgreSQL
        id: dependencies
        run: python -m pip install psycopg==3.3.6 psycopg-binary==3.3.6
      - name: Ejecutar tareas
        env:
          PIGGO_DAILY_MODE: ${{ inputs.mode || (github.event.schedule == '42 22 * * *' && 'cotizaciones') || 'todo' }}
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
        run: python infra/jobs/process_daily.py "$PIGGO_DAILY_MODE"
      - name: Avisar al responsable
        if: failure() && steps.dependencies.outcome == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PIGGO_DAILY_ALERT_EMAIL: ${{ secrets.PIGGO_DAILY_ALERT_EMAIL }}
          PIGGO_DAILY_FROM_EMAIL: ${{ vars.PIGGO_DAILY_FROM_EMAIL }}
        run: python infra/jobs/notify_daily_failure.py

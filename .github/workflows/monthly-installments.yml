name: Generar cuotas mensuales test

on:
  schedule:
    # 01:17 en Buenos Aires. Diario para recuperar fallos dentro del mismo mes.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-installments-test
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: test
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Instalar el cliente PostgreSQL
        run: python -m pip install psycopg==3.3.6 psycopg-binary==3.3.6
      - name: Generar el periodo actual
        env:
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
        run: python infra/jobs/generate_month.py
      - name: Registrar fallo
        if: failure()
        run: echo '::error::Fallo el proceso mensual. Revisar esta ejecucion; se reintentara en la proxima programacion.'

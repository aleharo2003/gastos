name: Piloto de correo de Piggo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operación del piloto en test
        type: choice
        options:
          - preview
          - send
          - preview-weekly
          - send-weekly
        default: preview

permissions:
  contents: read

concurrency:
  group: email-pilot-test
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: test
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Instalar el cliente PostgreSQL
        run: python -m pip install psycopg==3.3.6 psycopg-binary==3.3.6
      - name: Ejecutar el piloto
        env:
          PILOT_MODE: ${{ inputs.mode }}
          PILOT_DATABASE_URL: ${{ secrets.PILOT_DATABASE_URL }}
          PILOT_SUPABASE_ACCESS_TOKEN: ${{ secrets.PILOT_SUPABASE_ACCESS_TOKEN }}
          PILOT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PILOT_SUPABASE_PUBLISHABLE_KEY }}
          PILOT_SUPABASE_PROJECT_REF: ${{ vars.PILOT_SUPABASE_PROJECT_REF }}
          PILOT_USER_ID: ${{ vars.PILOT_USER_ID }}
          PILOT_SPACE_ID: ${{ vars.PILOT_SPACE_ID }}
          PILOT_EMAIL: ${{ secrets.PILOT_EMAIL }}
          PILOT_FROM_EMAIL: ${{ vars.PILOT_FROM_EMAIL }}
          PILOT_APP_URL: ${{ vars.PILOT_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python infra/jobs/deliver_test_reminder.py
